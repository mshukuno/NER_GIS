site_name: Unofficial Geospatial Knowledge Hub
theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs          # categories as top tabs
    - navigation.sections      # group trainings in sidebar
    - navigation.indexes       # index.md acts as section landing page
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - GNSS:
    - gnss/index.md
    - Fundamentals for Accurate Data Collection:
        - gnss/fundamentals/index.md
        - 1. GNSS Basics: gnss/fundamentals/01-gnss-basic.md
        - 2. Where Errors Come From: gnss/fundamentals/02-where-errors-come-from.md
        - 3. Precise Is Not Accurate: gnss/fundamentals/03-precise-is-not-accurate.md
        - 4. Same Place, Different Numbers: gnss/fundamentals/04-same-place-different-numbers.md
        - 5. Corrections: gnss/fundamentals/05-corrections.md
        - 6. Hard Places: gnss/fundamentals/06-hard-places.md
        - 7. Planning for Post-Processing: gnss/fundamentals/07-planning-for-post-processing.md
  - ArcGIS Pro:
      - arcgis-pro/index.md
  - Cartography:
      - cartography/index.md
  - About: about.md

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details        # collapsible blocks
  - pymdownx.superfences    # allows nesting code/other content inside

extra_css:
  - assets/css/extra.css

extra_javascript:
  - javascripts/self-check.js